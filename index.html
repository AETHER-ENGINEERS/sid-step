<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SID-STEP</title>

<style>
  :root {
    --bg: #14120f; --surface: #221f1a; --surface-2: #2c2822;
    --fg: #f4efe6; --muted: #a3988c; --accent: #e39b3a; --ink: #1a1206; --line: #3a342c;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.45 "Segoe UI", "Avenir Next", sans-serif; }
  main { max-width: 64rem; margin: 0 auto; padding: 1.25rem 1rem 2.5rem; display: flex; flex-direction: column; gap: 1.1rem; }
  h1 { font-family: Georgia, "Iowan Old Style", serif; font-size: 2.6rem; line-height: 1; margin: 0; font-weight: 500; }
  h2 { font-family: Georgia, "Iowan Old Style", serif; font-size: 1.6rem; line-height: 1; margin: 0; font-weight: 500; }
  .kicker { letter-spacing: 0.22em; text-transform: uppercase; color: var(--accent); font-size: 0.75rem; margin: 0 0 0.4rem; }
  .muted { color: var(--muted); }
  header { display: flex; flex-wrap: wrap; gap: 1rem; align-items: flex-end; justify-content: space-between; }
  button, input[type="range"] { font: inherit; }
  button { cursor: pointer; min-height: 2.75rem; border-radius: 0.7rem; border: 1px solid var(--line); background: transparent; color: var(--fg); padding: 0 0.8rem; }
  button.play { background: var(--accent); color: var(--ink); border-color: var(--accent); font-weight: 650; padding: 0 1.4rem; border-radius: 0.85rem; }
  button.on { background: var(--accent); color: var(--ink); border-color: var(--accent); font-weight: 650; }
  button.solid { background: var(--fg); color: var(--bg); border-color: var(--fg); font-weight: 650; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 1rem; padding: 0.9rem; }
  .row { display: flex; flex-wrap: wrap; gap: 0.45rem; align-items: center; }
  .lane { display: grid; grid-template-columns: 4.75rem 1fr; gap: 0.45rem; align-items: center; margin-top: 0.45rem; }
  .pads { display: grid; grid-template-columns: repeat(16, 2.75rem); gap: 0.25rem; width: max-content; }
  .scroll { overflow-x: auto; }
  .pad { min-width: 2.75rem; padding: 0; font-weight: 650; }
  .pad.filled { background: var(--accent); color: var(--ink); border-color: var(--accent); }
  .pad.now.filled { background: var(--fg); color: var(--bg); border-color: var(--fg); }
  .pad.now:not(.filled) { border-color: var(--fg); background: var(--surface-2); color: var(--fg); }
  .split { display: flex; justify-content: space-between; gap: 0.8rem; align-items: flex-start; }
  .sliders { display: grid; gap: 0.8rem; }
  @media (min-width: 720px) { .sliders { grid-template-columns: repeat(2, 1fr); } }
@media (min-width: 960px) { .sliders { grid-template-columns: repeat(4, 1fr); } }
  label.slider { display: flex; flex-direction: column; gap: 0.25rem; color: var(--fg); font-size: 0.92rem; }
  label.slider span { display: flex; justify-content: space-between; }
  label.slider em { color: var(--muted); font-style: normal; }
  input[type="range"] { width: 100%; accent-color: var(--accent); }
  .tiny { font-size: 0.75rem; letter-spacing: 0.08em; text-transform: uppercase; }
</style>
<script src="webxdc.js"></script>
</head>
<body>
<main id="app"></main>
<script>
const FCLK = 985248;
const NOTES = ["C", "D", "E", "F", "G", "A", "B", "C+"];
const SEMI = [0, 2, 4, 5, 7, 9, 11, 12];
const WAVES = ["soft", "bright", "hollow", "drum"];
const WAVE_HELP = {
  soft: ["Soft", "Round, like a flute"],
  bright: ["Bright", "Buzzy, the classic chip tone"],
  hollow: ["Hollow", "Thin and nasal. Width changes the color"],
  drum: ["Beat", "A tick. Higher notes are tighter"]
};
const OCTAVE_HELP = { "-1": "Low", "0": "Mid", "1": "High" };
const STORE = "sid-step-ui-v2";

function empty() { return Array(16).fill(null); }
function voice(id, name, blurb, wave, octave, pulse, level, steps) {
  return { id, name, blurb, wave, octave, pulse, level, mute: false, steps: steps.slice() };
}
function presetTogether() {
  return {
    bpm: 108, tone: 0.62, ring: 0.28, volume: 0.85,
    voices: [
      voice("tune", "Tune", "The melody on top", "soft", 0, 8, 0.75, [0,null,2,null,4,null,2,null,7,null,4,null,2,null,0,null]),
      voice("bass", "Bass", "The low line underneath", "bright", -1, 4, 0.6, [0,null,null,null,0,null,3,null,4,null,null,null,3,null,0,null]),
      voice("beat", "Beat", "The rhythm. Higher notes tick tighter", "drum", 0, 8, 0.45, [0,null,2,null,0,null,4,null,0,null,2,null,0,4,null,2])
    ]
  };
}
function presetBass() {
  return {
    bpm: 96, tone: 0.45, ring: 0.4, volume: 0.85,
    voices: [
      voice("tune", "Tune", "The melody on top", "soft", 1, 8, 0.5, empty()),
      voice("bass", "Bass", "The low line underneath", "bright", -1, 6, 0.8, [0,0,2,2,4,4,3,3,5,5,4,3,2,2,0,0]),
      voice("beat", "Beat", "The rhythm. Higher notes tick tighter", "drum", 0, 8, 0.35, [0,null,null,2,null,null,0,null,0,null,null,4,null,2,null,null])
    ]
  };
}
function presetEmpty() {
  return {
    bpm: 110, tone: 0.55, ring: 0.2, volume: 0.85,
    voices: [
      voice("tune", "Tune", "The melody on top", "soft", 0, 8, 0.7, empty()),
      voice("bass", "Bass", "The low line underneath", "bright", -1, 5, 0.6, empty()),
      voice("beat", "Beat", "The rhythm. Higher notes tick tighter", "drum", 0, 8, 0.45, empty())
    ]
  };
}
const PRESETS = [
  ["together", "All three", presetTogether],
  ["bassline", "Bass walk", presetBass],
  ["blank", "Empty", presetEmpty]
];

function sidHz(midi) {
  const hz = 440 * 2 ** ((midi - 69) / 12);
  const fn = Math.max(0, Math.min(16777215, Math.round(hz * 16777216 / FCLK)));
  return fn * FCLK / 16777216;
}
function midiFor(octave, degree) { return 60 + octave * 12 + SEMI[degree]; }

let pattern = load();
let picked = [0, 0, 0];
let active = 0;
let head = null;
const eng = createEngine();

function load() {
  try {
    const raw = localStorage.getItem(STORE);
    const parsed = raw && JSON.parse(raw);
    if (parsed && parsed.v == null) parsed.v = 1;
    if (validPattern(parsed)) return parsed;
  } catch (e) {}
  const fresh = presetTogether();
  fresh.v = 1;
  return fresh;
}
function save() {
  pattern.v = 1;
  try { localStorage.setItem(STORE, JSON.stringify(pattern)); } catch (e) {}
}

function createEngine() {
  const self = {
    ctx: null, filter: null, master: null, noise: null, voices: [], waves: new Map(),
    timer: 0, origin: 0, audioOrigin: null, scheduledUntil: 0, playing: false
  };
  function toneHz(amount) { return 140 * (7000 / 140) ** Math.min(1, Math.max(0, amount)); }
  function ringQ(amount) { return 0.7 + Math.min(1, Math.max(0, amount)) * 12; }
  function makeNoise(ctx) {
    const buf = ctx.createBuffer(1, ctx.sampleRate, ctx.sampleRate);
    const data = buf.getChannelData(0);
    let lfsr = 0x7fffff;
    for (let i = 0; i < data.length; i++) {
      const bit = ((lfsr >> 22) ^ (lfsr >> 17)) & 1;
      lfsr = ((lfsr << 1) | bit) & 0x7fffff;
      data[i] = lfsr & 1 ? 0.85 : -0.85;
    }
    return buf;
  }
  function boot() {
    if (self.ctx) return;
    const ctx = new AudioContext();
    self.ctx = ctx;
    self.noise = makeNoise(ctx);
    const mixer = ctx.createGain();
    const filter = ctx.createBiquadFilter();
    filter.type = "lowpass";
    const master = ctx.createGain();
    mixer.connect(filter); filter.connect(master); master.connect(ctx.destination);
    self.filter = filter; self.master = master;
    self.voices = [0, 1, 2].map(() => {
      const gain = ctx.createGain();
      gain.gain.value = 0;
      gain.connect(mixer);
      return { gain, node: null, wave: null, pulse: 0 };
    });
  }
  function pulseWave(ctx, duty) {
    const width = Math.max(1, Math.min(15, duty | 0));
    const d = width / 16;
    if (self.waves.has(width) && ctx === self.ctx) return self.waves.get(width);
    const real = new Float32Array(32), imag = new Float32Array(32);
    for (let n = 1; n < 32; n++) imag[n] = (2 / (n * Math.PI)) * Math.sin(n * Math.PI * d);
    const wave = ctx.createPeriodicWave(real, imag);
    if (ctx === self.ctx) self.waves.set(width, wave);
    return wave;
  }
  function ensure(slot, wave, pulse, when) {
    const ctx = self.ctx;
    if (slot.node && slot.wave === wave && (wave !== "hollow" || slot.pulse === pulse)) return;
    if (slot.node) { try { slot.node.stop(when); } catch (e) {} slot.node.disconnect(); slot.node = null; }
    let node;
    if (wave === "drum") {
      node = ctx.createBufferSource();
      node.buffer = self.noise;
      node.loop = true;
    } else {
      node = ctx.createOscillator();
      if (wave === "hollow") node.setPeriodicWave(pulseWave(ctx, pulse));
      else node.type = wave === "bright" ? "sawtooth" : "triangle";
    }
    node.connect(slot.gain);
    node.start(when);
    slot.node = node; slot.wave = wave; slot.pulse = pulse;
  }
  function hit(slot, voice, stepIndex, when, dur) {
    ensure(slot, voice.wave, voice.pulse, when);
    const degree = voice.steps[stepIndex];
    const gain = slot.gain.gain;
    gain.cancelScheduledValues(when);
    if (voice.mute || degree == null || !slot.node) { gain.setValueAtTime(0, when); return; }
    const hz = sidHz(midiFor(voice.octave, degree));
    if (slot.node.frequency) slot.node.frequency.setValueAtTime(hz, when);
    else slot.node.playbackRate.setValueAtTime(Math.max(0.08, hz / 160), when);
    const peak = 0.28 * voice.level;
    const attack = voice.wave === "drum" ? 0.002 : 0.004;
    const release = voice.wave === "drum" ? Math.min(0.05, dur * 0.45) : 0.012;
    gain.setValueAtTime(0, when);
    gain.linearRampToValueAtTime(peak, when + attack);
    gain.setValueAtTime(peak, when + Math.max(attack, dur - release));
    gain.linearRampToValueAtTime(0, when + dur);
  }
  function tick() {
    if (!self.playing || !self.ctx) return;
    const dur = 60 / pattern.bpm / 4;
    const elapsed = (performance.now() - self.origin) / 1000;
    paintHead(Math.floor(elapsed / dur) % 16);
    const ctx = self.ctx;
    if (ctx.state !== "running") return;
    if (self.audioOrigin == null) self.audioOrigin = ctx.currentTime - elapsed;
    self.filter.frequency.setTargetAtTime(toneHz(pattern.tone), ctx.currentTime, 0.03);
    self.filter.Q.setTargetAtTime(ringQ(pattern.ring), ctx.currentTime, 0.03);
    self.master.gain.setTargetAtTime(pattern.volume, ctx.currentTime, 0.03);
    const horizon = ctx.currentTime + 0.08;
    while (self.audioOrigin + self.scheduledUntil < horizon) {
      const when = Math.max(self.audioOrigin + self.scheduledUntil, ctx.currentTime);
      const stepIndex = Math.floor(self.scheduledUntil / dur) % 16;
      if (self.audioOrigin + self.scheduledUntil >= ctx.currentTime - 0.02) {
        pattern.voices.forEach((voice, i) => hit(self.voices[i], voice, stepIndex, when, dur));
      }
      self.scheduledUntil += dur;
    }
  }
  self.start = function () {
    boot();
    if (self.playing) return;
    self.playing = true;
    self.origin = performance.now();
    self.audioOrigin = null;
    self.scheduledUntil = 0;
    void self.ctx.resume();
    tick();
    self.timer = setInterval(tick, 40);
  };
  self.stop = function () {
    self.playing = false;
    clearInterval(self.timer);
    self.audioOrigin = null;
    if (!self.ctx) return;
    const now = self.ctx.currentTime;
    self.voices.forEach((v) => {
      v.gain.gain.cancelScheduledValues(now);
      v.gain.gain.setTargetAtTime(0, now, 0.02);
      if (v.node) {
        try { v.node.stop(now + 0.05); } catch (e) {}
        v.node.disconnect();
        v.node = null;
        v.wave = null;
      }
    });
    paintHead(null);
  };
  return self;
}

function el(tag, cls, text) {
  const node = document.createElement(tag);
  if (cls) node.className = cls;
  if (text != null) node.textContent = text;
  return node;
}
function paintHead(index) {
  head = index;
  document.querySelectorAll("[data-step]").forEach((btn) => {
    btn.classList.toggle("now", Number(btn.dataset.step) === index);
  });
  const status = document.getElementById("status");
  if (!status) return;
  if (!eng.playing || index == null) {
    status.textContent = "Press Play. The bright column is the playhead.";
    return;
  }
  const sounding = pattern.voices.map((track) => {
    if (track.mute || track.steps[index] == null) return null;
    return track.name + " " + NOTES[track.steps[index]];
  }).filter(Boolean);
  status.textContent = sounding.length ? sounding.join(" · ") : "This step is silent. The line keeps moving.";
}
function render() {
  const root = document.getElementById("app");
  root.replaceChildren();
  const header = el("header");
  const titles = el("div");
  titles.append(el("p", "kicker", "Three tracks, one clock"), el("h1", "", "SID-STEP"));
  const lead = el("p", "muted");
  lead.textContent = "Tune, bass, and beat all run together. Choose a note, tap a pad to place it, tap it again to clear it.";
  titles.append(lead);
  const play = el("button", "play", eng.playing ? "Stop" : "Play");
  play.onclick = () => { if (eng.playing) eng.stop(); else eng.start(); render(); };
  header.append(titles, play);

  const board = el("section", "card");
  const presets = el("div", "row");
  PRESETS.forEach(([id, name, factory]) => {
    const b = el("button", "", name);
    b.onclick = () => { pattern = factory(); picked = [0, 0, 0]; save(); render(); };
    presets.append(b);
  });
  const status = el("p", "muted");
  status.id = "status";
  presets.append(status);
  board.append(presets);
  pattern.voices.forEach((track, voiceIndex) => {
    const lane = el("div", "lane");
    const name = el("button", voiceIndex === active ? "on" : "", track.name);
    name.onclick = () => { active = voiceIndex; render(); };
    const scroll = el("div", "scroll");
    const pads = el("div", "pads");
    track.steps.forEach((step, stepIndex) => {
      const pad = el("button", "pad" + (step != null ? " filled" : "") + (head === stepIndex ? " now" : ""), step != null ? NOTES[step] : "");
      pad.dataset.step = String(stepIndex);
      pad.setAttribute("aria-label", track.name + " step " + (stepIndex + 1) + (step != null ? ", " + NOTES[step] : ", empty"));
      pad.onclick = () => {
        active = voiceIndex;
        const choice = picked[voiceIndex];
        track.steps[stepIndex] = track.steps[stepIndex] === choice ? null : choice;
        save();
        render();
      };
      pads.append(pad);
    });
    scroll.append(pads);
    lane.append(name, scroll);
    board.append(lane);
  });

  const voice = pattern.voices[active];
  const editor = el("section", "card");
  const split = el("div", "split");
  const who = el("div");
  who.append(el("h2", "", voice.name), el("p", "muted", voice.blurb));
  const actions = el("div", "row");
  const mute = el("button", voice.mute ? "" : "solid", voice.mute ? "Muted" : "On");
  mute.onclick = () => { voice.mute = !voice.mute; save(); render(); };
  const clear = el("button", "", "Clear");
  clear.onclick = () => { voice.steps = empty(); save(); render(); };
  actions.append(mute, clear);
  split.append(who, actions);
  editor.append(split);
  const waves = el("div", "row");
  WAVES.forEach((wave) => {
    const b = el("button", voice.wave === wave ? "on" : "", WAVE_HELP[wave][0]);
    b.onclick = () => { voice.wave = wave; save(); render(); };
    waves.append(b);
  });
  editor.append(waves, el("p", "muted", WAVE_HELP[voice.wave][1]));
  const octaves = el("div", "row");
  octaves.append(el("span", "tiny muted", "Pitch"));
  [-1, 0, 1].forEach((octave) => {
    const b = el("button", voice.octave === octave ? "solid" : "", OCTAVE_HELP[String(octave)]);
    b.onclick = () => { voice.octave = octave; save(); render(); };
    octaves.append(b);
  });
  editor.append(octaves);
  if (voice.wave === "hollow") {
    const width = el("label", "slider");
    width.append("Width");
    const range = document.createElement("input");
    range.type = "range"; range.min = "1"; range.max = "15"; range.value = String(voice.pulse);
    range.oninput = () => { voice.pulse = Number(range.value); save(); };
    width.append(range);
    editor.append(width);
  }
  editor.append(el("p", "tiny muted", "Note to place"));
  const notes = el("div", "row");
  NOTES.forEach((name, degree) => {
    const b = el("button", picked[active] === degree ? "solid" : "", name);
    b.onclick = () => { picked[active] = degree; render(); };
    notes.append(b);
  });
  const loud = el("label", "slider");
  const loudTop = document.createElement("span");
  loudTop.append("Loudness");
  const loudRange = document.createElement("input");
  loudRange.type = "range"; loudRange.min = "0"; loudRange.max = "100"; loudRange.value = String(Math.round(voice.level * 100));
  loudRange.oninput = () => { voice.level = Number(loudRange.value) / 100; save(); };
  loud.append(loudTop, loudRange);
  editor.append(notes, loud);

  const sliders = el("section", "card sliders");
  sliders.append(slider("Speed", String(pattern.bpm), 60, 180, pattern.bpm, (v) => { pattern.bpm = v; save(); document.querySelector("#speed-hint").textContent = String(v); }, "speed-hint"));
  sliders.append(slider("Tone", "Dark to bright", 0, 100, Math.round(pattern.tone * 100), (v) => { pattern.tone = v / 100; save(); }));
  sliders.append(slider("Ring", "How much it sings", 0, 100, Math.round(pattern.ring * 100), (v) => { pattern.ring = v / 100; save(); }));
  sliders.append(slider("Volume", "Loud or quiet", 0, 100, Math.round(pattern.volume * 100), (v) => { pattern.volume = v / 100; save(); }));

  const shareRow = el("div", "row");
  if (window.webxdc && typeof webxdc.sendUpdate === "function") {
    const share = el("button", "", "Share pattern");
    share.onclick = () => {
      webxdc.sendUpdate({
        payload: { v: 1, bpm: pattern.bpm, tone: pattern.tone, ring: pattern.ring, volume: pattern.volume, voices: pattern.voices },
        info: "SID pattern",
        summary: "SID-STEP",
        document: "SID-STEP"
      }, "");
    };
    shareRow.append(share);
  }

  root.append(header, board, editor, sliders, shareRow);
  paintHead(head);
}
function slider(label, hint, min, max, value, oninput, hintId) {
  const wrap = el("label", "slider");
  const top = document.createElement("span");
  top.append(label);
  const em = document.createElement("em");
  em.textContent = hint;
  if (hintId) em.id = hintId;
  top.append(em);
  const range = document.createElement("input");
  range.type = "range"; range.min = String(min); range.max = String(max); range.value = String(value);
  range.oninput = () => oninput(Number(range.value));
  wrap.append(top, range);
  return wrap;
}

function validPattern(payload) {
  if (!payload || payload.v !== 1 || !Array.isArray(payload.voices) || payload.voices.length !== 3) return false;
  if (!Number.isFinite(payload.bpm) || payload.bpm < 60 || payload.bpm > 180) return false;
  for (const key of ["tone", "ring", "volume"]) {
    if (typeof payload[key] !== "number" || !Number.isFinite(payload[key]) || payload[key] < 0 || payload[key] > 1) return false;
  }
  for (const voice of payload.voices) {
    if (!voice || !WAVES.includes(voice.wave)) return false;
    if (![-1, 0, 1].includes(voice.octave)) return false;
    if (!Number.isInteger(voice.pulse) || voice.pulse < 1 || voice.pulse > 15) return false;
    if (typeof voice.level !== "number" || !Number.isFinite(voice.level) || voice.level < 0 || voice.level > 1) return false;
    if (!Array.isArray(voice.steps) || voice.steps.length !== 16) return false;
    if (voice.steps.some((step) => step !== null && (!Number.isInteger(step) || step < 0 || step > 7))) return false;
  }
  return true;
}

window.addEventListener("keydown", (event) => {
  if (event.code !== "Space") return;
  const tag = event.target && event.target.tagName;
  if (tag === "INPUT" || tag === "TEXTAREA" || tag === "BUTTON") return;
  event.preventDefault();
  try {
    if (eng.playing) eng.stop(); else eng.start();
    render();
  } catch (e) {}
});
if (window.webxdc && typeof webxdc.setUpdateListener === "function") {
  webxdc.setUpdateListener((update) => {
    try {
      if (!validPattern(update && update.payload)) return;
      pattern = update.payload;
      save();
      render();
    } catch (e) {}
  }, 0);
}
render();
</script>
</body>
</html>
