const eng = createEngine();

    high: !!(filter && filter.high === true)

  p.voices.forEach((v) => {

    v.fine = clampNum(v.fine, 0, -100, 100);

  p.decay = clampNum(p.decay, 0.001, 0.001, 1.5);
  p.sustain = clampNum(p.sustain, 1, 0, 1);
  p.release = clampNum(p.release, 0.012, 0.001, 2);
  p.lfoRate = clampNum(p.lfoRate, 4, 0.1, 20);

    for (let i = 0; i < 16; i++) steps[i] = known.includes(p.sample.steps[i]) ? p.sample.steps[i] : null;

    btn.classList.toggle("now", Number(btn.dataset.step) === index);
  });
  const status = document.getElementById("status");
  if (!status) return;
  if (!eng.playing || index == null) {
    status.textContent = "Press Play. The bright column is the playhead.";
    return;
  }
  const sounding = pattern.voices.map((track) => {
    if (track.mute || track.steps[index] == null) return null;
    return track.name + " " + NOTES[track.steps[index]];
  }).filter(Boolean);
  if (pattern.sample && !pattern.sample.mute && pattern.sample.steps[index]) {
    sounding.push("Sample " + HIT_NAME[pattern.sample.steps[index]]);
  }
  status.textContent = sounding.length ? sounding.join(" · ") : "This step is silent. The line keeps moving.";
}
function render() {
  applyDefaults(pattern);
  const root = document.getElementById("app");
  root.replaceChildren();
  const header = el("header");
  const titles = el("div");
  titles.append(el("p", "kicker", "Three tracks, plus samples"), el("h1", "", "SID-STEP"));
  const lead = el("p", "muted");
  lead.textContent = "Tune, bass, and beat run together. Cutoff and resonance shape the filter. Tap a sample pad to cycle kick, snare, and hat.";
  titles.append(lead);
  const play = el("button", "play", eng.playing ? "Stop" : "Play");
  play.onclick = () => { if (eng.playing) eng.stop(); else eng.start(); render(); };
  header.append(titles, play);

  const board = el("section", "card");
  const presets = el("div", "row");
  PRESETS.forEach(([id, name, factory]) => {
    const b = el("button", "", name);
    b.onclick = () => { pattern = factory(); picked = [0, 0, 0]; save(); render(); };
    presets.append(b);
  });
  const status = el("p", "muted");
  status.id = "status";
  presets.append(status);
  board.append(presets);
  pattern.voices.forEach((track, voiceIndex) => {
    const lane = el("div", "lane");
    const name = el("button", voiceIndex === active ? "on" : "", track.name);
    name.onclick = () => { active = voiceIndex; render(); };
    const scroll = el("div", "scroll");
    const pads = el("div", "pads");
    track.steps.forEach((step, stepIndex) => {
      const pad = el("button", "pad" + (step != null ? " filled" : "") + (head === stepIndex ? " now" : ""), step != null ? NOTES[step] : "");
      pad.dataset.step = String(stepIndex);
      pad.setAttribute("aria-label", track.name + " step " + (stepIndex + 1) + (step != null ? ", " + NOTES[step] : ", empty"));
      pad.onclick = () => {
        active = voiceIndex;
        const choice = picked[voiceIndex];
        track.steps[stepIndex] = track.steps[stepIndex] === choice ? null : choice;
        save();
        render();
      };
      pads.append(pad);
    });
    scroll.append(pads);
    lane.append(name, scroll);
    board.append(lane);
  });
  const sampleLane = el("div", "lane");
  const sampleName = el("button", active === 3 ? "on" : "", "Sample");
  sampleName.onclick = () => { active = 3; render(); };
  const sampleScroll = el("div", "scroll");
  const samplePads = el("div", "pads");
  pattern.sample.steps.forEach((step, stepIndex) => {
    const pad = el("button", "pad" + (step ? " filled" : "") + (head === stepIndex ? " now" : ""), step ? HIT_MARK[step] : "");
    pad.dataset.step = String(stepIndex);
    pad.setAttribute("aria-label", "Sample step " + (stepIndex + 1) + (step ? ", " + HIT_NAME[step] : ", empty"));
    pad.onclick = () => {
      active = 3;
      const at = HITS.indexOf(step);
      pattern.sample.steps[stepIndex] = HITS[(at + 1) % HITS.length];
      save();
      render();
    };
    samplePads.append(pad);
  });
  sampleScroll.append(samplePads);
  sampleLane.append(sampleName, sampleScroll);
  board.append(sampleLane);

  const editor = el("section", "card");
  if (active === 3) {
    const sample = pattern.sample;
    const split = el("div", "split");
    const who = el("div");
    who.append(el("h2", "", "Sample"), el("p", "muted", "A one-shot row. It does not use up Tune, Bass, or Beat."));
    const actions = el("div", "row");
    const routed = el("button", sample.filter ? "on" : "", sample.filter ? "Filtered" : "Dry");
    routed.onclick = () => { sample.filter = !sample.filter; save(); render(); };
    const mute = el("button", sample.mute ? "" : "solid", sample.mute ? "Muted" : "On");
    mute.onclick = () => { sample.mute = !sample.mute; save(); render(); };
    const clear = el("button", "", "Clear");
    clear.onclick = () => { sample.steps = empty(); save(); render(); };
    actions.append(routed, mute, clear);
    split.append(who, actions);
    const loud = el("label", "slider");
    const loudTop = document.createElement("span");
    loudTop.append("Loudness");
    const loudRange = document.createElement("input");
    loudRange.type = "range"; loudRange.min = "0"; loudRange.max = "100"; loudRange.value = String(Math.round(sample.level * 100));
    loudRange.oninput = () => { sample.level = Number(loudRange.value) / 100; save(); };
    loud.append(loudTop, loudRange);
    editor.append(split, el("p", "muted", "Tap a pad to cycle empty, kick, snare, hat. K, S, and H mark the hits. Dry keeps them out of the filter."), loud);
  } else {
  const voice = pattern.voices[active];
  const split = el("div", "split");
  const who = el("div");
  who.append(el("h2", "", voice.name), el("p", "muted", voice.blurb));
  const actions = el("div", "row");
  const routed = el("button", voice.filter === false ? "" : "on", voice.filter === false ? "Dry" : "Filtered");
  routed.onclick = () => { voice.filter = voice.filter === false; save(); render(); };
  const mute = el("button", voice.mute ? "" : "solid", voice.mute ? "Muted" : "On");
  mute.onclick = () => { voice.mute = !voice.mute; save(); render(); };
  const clear = el("button", "", "Clear");
  clear.onclick = () => { voice.steps = empty(); save(); render(); };
  actions.append(routed, mute, clear);
  split.append(who, actions);
  editor.append(split);
  const waves = el("div", "row");
  WAVES.forEach((wave) => {
    const b = el("button", voice.wave === wave ? "on" : "", WAVE_HELP[wave][0]);
    b.onclick = () => { voice.wave = wave; save(); render(); };
    waves.append(b);
  });
  editor.append(waves, el("p", "muted", WAVE_HELP[voice.wave][1]));
  const octaves = el("div", "row");
  octaves.append(el("span", "tiny muted", "Pitch"));
  [-1, 0, 1].forEach((octave) => {
    const b = el("button", voice.octave === octave ? "solid" : "", OCTAVE_HELP[String(octave)]);
    b.onclick = () => { voice.octave = octave; save(); render(); };
    octaves.append(b);
  });
  editor.append(octaves);
  if (voice.wave === "hollow") {
    const width = el("label", "slider");
    width.append("Width");
    const range = document.createElement("input");
    range.type = "range"; range.min = "1"; range.max = "15"; range.value = String(voice.pulse);
    range.oninput = () => { voice.pulse = Number(range.value); save(); };
    width.append(range);
    editor.append(width);
  }
  editor.append(el("p", "tiny muted", "Note to place"));
  const notes = el("div", "row");
  NOTES.forEach((name, degree) => {
    const b = el("button", picked[active] === degree ? "solid" : "", name);
    b.onclick = () => { picked[active] = degree; render(); };
    notes.append(b);
  });
  const fine = el("label", "slider");
  const fineTop = document.createElement("span");
  fineTop.append("Fine");
  const fineHint = document.createElement("em");
  fineHint.textContent = (voice.fine || 0) + " cents";
  fineTop.append(fineHint);
  const fineRange = document.createElement("input");
  fineRange.type = "range"; fineRange.min = "-100"; fineRange.max = "100"; fineRange.value = String(voice.fine || 0);
  fineRange.oninput = () => { voice.fine = Number(fineRange.value); fineHint.textContent = voice.fine + " cents"; save(); };
  fine.append(fineTop, fineRange);
  const loud = el("label", "slider");
  const loudTop = document.createElement("span");
  loudTop.append("Loudness");
  const loudRange = document.createElement("input");
  loudRange.type = "range"; loudRange.min = "0"; loudRange.max = "100"; loudRange.value = String(Math.round(voice.level * 100));
  loudRange.oninput = () => { voice.level = Number(loudRange.value) / 100; save(); };
  loud.append(loudTop, loudRange);
  editor.append(notes, fine, loud);
  }

  const sliders = el("section", "card");
  const modes = el("div", "row");
  modes.append(el("span", "tiny muted", "Filter"));
  [["low", "Low"], ["band", "Band"], ["high", "High"]].forEach(([key, label]) => {
    const b = el("button", pattern.filter[key] ? "on" : "", label);
    b.onclick = () => { pattern.filter[key] = !pattern.filter[key]; save(); render(); };
    modes.append(b);
  });
  sliders.append(modes, el("p", "muted", "Low, band, and high can be on together. Dry skips the filter. If none are on, filtered tracks go quiet."));
  const grid = el("div", "sliders");
  grid.append(slider("Speed", String(pattern.bpm), 60, 180, pattern.bpm, (v) => { pattern.bpm = v; save(); document.querySelector("#speed-hint").textContent = String(v); }, "speed-hint"));
  grid.append(slider("Cutoff", "Where the filter opens", 0, 100, Math.round(pattern.tone * 100), (v) => { pattern.tone = v / 100; save(); }));
  grid.append(slider("Resonance", "How sharp the peak is", 0, 100, Math.round(pattern.ring * 100), (v) => { pattern.ring = v / 100; save(); }));
  grid.append(slider("Volume", "Loud or quiet", 0, 100, Math.round(pattern.volume * 100), (v) => { pattern.volume = v / 100; save(); }));
  const env = el("div", "sliders");
  env.append(slider("Attack", Math.round(pattern.attack * 1000) + " ms", 1, 400, Math.round(pattern.attack * 1000), (v) => { pattern.attack = v / 1000; save(); }));
  env.append(slider("Decay", Math.round(pattern.decay * 1000) + " ms", 1, 400, Math.round(pattern.decay * 1000), (v) => { pattern.decay = v / 1000; save(); }));
  env.append(slider("Sustain", "Level after the decay", 0, 100, Math.round(pattern.sustain * 100), (v) => { pattern.sustain = v / 100; save(); }));
  env.append(slider("Release", Math.round(pattern.release * 1000) + " ms", 1, 800, Math.round(pattern.release * 1000), (v) => { pattern.release = v / 1000; save(); }));
  env.append(slider("LFO rate", pattern.lfoRate.toFixed(1) + " Hz", 1, 200, Math.round(pattern.lfoRate * 10), (v) => { pattern.lfoRate = v / 10; save(); }));
  env.append(slider("LFO amount", "How far the cutoff wanders", 0, 100, Math.round(pattern.lfoDepth * 100), (v) => { pattern.lfoDepth = v / 100; save(); }));
  sliders.append(env);
  sliders.append(grid);

  const shareRow = el("div", "row");
  if (window.webxdc && typeof webxdc.sendUpdate === "function") {
    const share = el("button", "", "Share pattern");
    share.onclick = () => {
      webxdc.sendUpdate({
        payload: { v: 1, bpm: pattern.bpm, tone: pattern.tone, ring: pattern.ring, volume: pattern.volume, attack: pattern.attack, decay: pattern.decay, sustain: pattern.sustain, release: pattern.release, lfoRate: pattern.lfoRate, lfoDepth: pattern.lfoDepth, filter: pattern.filter, sample: pattern.sample, voices: pattern.voices },
        info: "SID pattern",
        summary: "SID-STEP",
        document: "SID-STEP"
      }, "");
    };
    shareRow.append(share);
  }

  root.append(header, board, editor, sliders, shareRow, piano(active === 3 ? 0 : active));
  paintHead(head);
}
function piano(voiceIndex) {
  const voice = pattern.voices[voiceIndex];
  const bar = el("section", "keys");
  bar.append(el("p", "tiny muted", active === 3 ? "Keys play Tune" : "Keys play " + voice.name));
  const row = el("div", "keyrow");
  const whites = [[0, "C"], [2, "D"], [4, "E"], [5, "F"], [7, "G"], [9, "A"], [11, "B"], [12, "C"], [14, "D"], [16, "E"], [17, "F"], [19, "G"], [21, "A"], [23, "B"]];
  const blacks = { 1: "C#", 3: "D#", 6: "F#", 8: "G#", 10: "A#", 13: "C#", 15: "D#", 18: "F#", 20: "G#", 22: "A#" };
  whites.forEach(([semi, name]) => {
    const wrap = el("div", "keywrap");
    const white = el("button", "key white", name);
    white.onpointerdown = (event) => { event.preventDefault(); eng.tapSemi(voiceIndex, semi); };
    wrap.append(white);
    const sharp = semi + 1;
    if (blacks[sharp]) {
      const black = el("button", "key black", blacks[sharp]);
      black.onpointerdown = (event) => { event.preventDefault(); event.stopPropagation(); eng.tapSemi(voiceIndex, sharp); };
      wrap.append(black);
    }
    row.append(wrap);
  });
  bar.append(row);
  return bar;
}
function slider(label, hint, min, max, value, oninput, hintId) {
  const wrap = el("label", "slider");
  const top = document.createElement("span");
  top.append(label);
  const em = document.createElement("em");
  em.textContent = hint;
  if (hintId) em.id = hintId;
  top.append(em);
  const range = document.createElement("input");
  range.type = "range"; range.min = String(min); range.max = String(max); range.value = String(value);
  range.oninput = () => oninput(Number(range.value));
  wrap.append(top, range);
  return wrap;
}

function validPattern(payload) {
  if (!payload || payload.v !== 1 || !Array.isArray(payload.voices) || payload.voices.length !== 3) return false;
  if (!Number.isFinite(payload.bpm) || payload.bpm < 60 || payload.bpm > 180) return false;
  if (payload.filter != null) {
    const filter = payload.filter;
    if (typeof filter !== "object") return false;
    for (const key of ["low", "band", "high"]) if (typeof filter[key] !== "boolean") return false;
  }
  for (const key of ["tone", "ring", "volume"]) {
    if (typeof payload[key] !== "number" || !Number.isFinite(payload[key]) || payload[key] < 0 || payload[key] > 1) return false;
  }
  for (const voice of payload.voices) {
    if (!voice || !WAVES.includes(voice.wave)) return false;
    if (![-1, 0, 1].includes(voice.octave)) return false;
    if (!Number.isInteger(voice.pulse) || voice.pulse < 1 || voice.pulse > 15) return false;
    if (voice.fine != null && (typeof voice.fine !== "number" || voice.fine < -100 || voice.fine > 100)) return false;
    if (!Array.isArray(voice.steps) || voice.steps.length !== 16) return false;
    if (voice.steps.some((step) => step !== null && (!Number.isInteger(step) || step < 0 || step > 7))) return false;
  }
  if (payload.sample != null) {
    const sample = payload.sample;
    const known = ["kick", "snare", "hat"];
    if (!sample || !Array.isArray(sample.steps) || sample.steps.length !== 16) return false;
    if (sample.steps.some((step) => step != null && !known.includes(step))) return false;
    if (sample.level != null && (typeof sample.level !== "number" || sample.level < 0 || sample.level > 1)) return false;
    if (sample.mute != null && typeof sample.mute !== "boolean") return false;
    if (sample.filter != null && typeof sample.filter !== "boolean") return false;
  }
  if (!optRange(payload.attack, 0.001, 1.5)) return false;
  if (!optRange(payload.decay, 0.001, 1.5)) return false;
  if (!optRange(payload.sustain, 0, 1)) return false;
  if (!optRange(payload.release, 0.001, 2)) return false;
  if (!optRange(payload.lfoRate, 0.1, 20)) return false;
  if (!optRange(payload.lfoDepth, 0, 1)) return false;
  return true;
}
function optRange(value, min, max) {
  return value == null || (typeof value === "number" && Number.isFinite(value) && value >= min && value <= max);
}

window.addEventListener("keydown", (event) => {
  if (event.code !== "Space") return;
  const tag = event.target && event.target.tagName;
  if (tag === "INPUT" || tag === "TEXTAREA" || tag === "BUTTON") return;
  event.preventDefault();
  try {
    if (eng.playing) eng.stop(); else eng.start();
    render();
  } catch (e) {}
});
if (window.webxdc && typeof webxdc.setUpdateListener === "function") {
  webxdc.setUpdateListener((update) => {
    try {
      if (!validPattern(update && update.payload)) return;
      pattern = applyDefaults(update.payload);
      save();
      render();
    } catch (e) {}
  }, 0);
}
render();
</script>
</body>
</html>
